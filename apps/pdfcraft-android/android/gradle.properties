org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for phones, x86_64 for the emulator. Build one to save time,
# e.g. `./gradlew installRelease -Ppdfcraft.abis=arm64-v8a`.
pdfcraft.abis=arm64-v8a,x86_64

# The app's version. A release build from a version tag (v0.0.1-beta, …) takes the tag's instead
# (.github/workflows/release.yml); keep this the version being worked towards.
pdfcraft.version=0.0.1-beta
